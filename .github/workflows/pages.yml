name: Deploy to GitHub Pages

# main への push で公開する。Pages 経由なら iPhone からも HTTPS でそのまま遊べる。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: 配信ファイルの収集(静的サイトのみ)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/

      - name: バージョン情報の埋め込み(コミット短縮ハッシュ+日付)
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          printf 'export const VERSION = "%s (%s)";\n' "$SHORT_SHA" "$BUILD_DATE" > _site/js/version.js
          cat _site/js/version.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
